services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      # Exposed to host so the native app connects via localhost:6379.
      # If you already have Redis on port 6379, change to e.g. "16379:6379"
      # and update PAPERMERGE__REDIS__URL=redis://localhost:16379/0 in .env.dev.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr_worker:
    build:
      context: .
      dockerfile: docker/ocrworker/Dockerfile
    command: worker
    restart: unless-stopped
    environment:
      # host.docker.internal resolves to the host machine (your PC).
      # Docker Desktop (Win/Mac) injects this automatically; extra_hosts below
      # makes it work on Linux Docker Engine too.
      PAPERMERGE__DATABASE__URL: postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:5432/${DB_NAME}
      PAPERMERGE__REDIS__URL: redis://redis:6379/0
      PAPERMERGE__MAIN__MEDIA_ROOT: /var/media/pmg
      OCR_WORKER_ARGS: "-Q ocr -c 2"
    volumes:
      # Bind-mount the local ./media folder into the container.
      # Note: if you previously ran the full docker-compose.yml, documents are
      # in the Docker named volume "media_root", not in ./media — copy them over
      # if needed: docker cp <container>:/var/media/pmg/. ./media/
      - ./media:/var/media/pmg
    extra_hosts:
      # Required on Linux Docker Engine; Docker Desktop (Win/Mac) adds this automatically.
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
