services:
  gateway:
    build:
      context: .
      dockerfile: docker/native-auth/gateway.Dockerfile
    restart: unless-stopped
    environment:
      PAPERMERGE_NATIVE_CORE_HOST: ${PAPERMERGE_NATIVE_CORE_HOST:-host.docker.internal}
      PAPERMERGE_NATIVE_CORE_PORT: ${PAPERMERGE_NATIVE_CORE_PORT:-8000}
      PAPERMERGE_AUTH_UI_UPSTREAM: authserver:80
      PAPERMERGE_AUTH_API_UPSTREAM: authserver:8000
    ports:
      - "${GATEWAY_PORT:-18000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - authserver

  authserver:
    image: papermerge/auth-server:1.1.5
    restart: unless-stopped
    environment:
      PAPERMERGE__SECURITY__SECRET_KEY: ${SECRET_KEY}
      PAPERMERGE__DATABASE__URL: postgresql://${DB_USER}:${DB_PASSWORD}@${PAPERMERGE_DB_HOST:-host.docker.internal}:${PAPERMERGE_DB_PORT:-5432}/${DB_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr_worker:
    build:
      context: .
      dockerfile: docker/ocrworker/Dockerfile
    command: worker
    restart: unless-stopped
    environment:
      PAPERMERGE__DATABASE__URL: postgresql://${DB_USER}:${DB_PASSWORD}@${PAPERMERGE_DB_HOST:-host.docker.internal}:${PAPERMERGE_DB_PORT:-5432}/${DB_NAME}
      PAPERMERGE__REDIS__URL: redis://redis:6379/0
      PAPERMERGE__MAIN__MEDIA_ROOT: /var/media/pmg
      OCR_WORKER_ARGS: ${OCR_WORKER_ARGS:--Q ocr -c 2}
    volumes:
      - ${PAPERMERGE_MEDIA_HOST_PATH:-./media}:/var/media/pmg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
